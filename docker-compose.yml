services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_history
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 3s
      retries: 5

  chat-server:
    build:
      context: .
      dockerfile: Dockerfile.chat
      target: development
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HISTORY_SERVICE_URL: http://history-service:3001
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      history-service:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/app/src
        - action: rebuild
          path: ./package.json

  history-service:
    build:
      context: .
      dockerfile: Dockerfile.history
      target: development
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: chat
      PG_PASSWORD: chat
      PG_DATABASE: chat_history
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/app/src
        - action: rebuild
          path: ./package.json

volumes:
  postgres-data:
